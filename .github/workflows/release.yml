# Builds TwinDesk.app, packages it as a DMG, publishes a GitHub release and
# points the Homebrew cask at it. Runs when a version tag is pushed:
#   git tag v0.2.0 && git push origin v0.2.0
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build the app
        run: BUILD="$GITHUB_RUN_NUMBER" ./scripts/build-app.sh

      - name: Check the bundle
        run: |
          codesign --verify --deep --strict dist/TwinDesk.app
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/TwinDesk.app/Contents/Info.plist)" = "$VERSION"
          lipo -archs dist/TwinDesk.app/Contents/MacOS/TwinDesk

      - name: Build the DMG
        run: |
          ./scripts/make-dmg.sh "$VERSION"
          echo "SHA256=$(shasum -a 256 "dist/TwinDesk-$VERSION.dmg" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<NOTES
          Install with Homebrew:

              brew tap chdominguez/twindesk https://github.com/chdominguez/TwinDesk
              brew install --cask twindesk

          Or download the DMG below and drag TwinDesk to Applications. The app is not notarized;
          see "Installing" in the README for the first launch.

          SHA-256: \`$SHA256\`
          NOTES
          gh release create "$GITHUB_REF_NAME" "dist/TwinDesk-$VERSION.dmg" \
            --title "TwinDesk $VERSION" --notes-file notes.md --generate-notes --verify-tag

      - name: Point the Homebrew cask at this release
        run: |
          git fetch origin main
          git checkout -B main origin/main
          sed -i '' -E "s/^  version \".*\"/  version \"$VERSION\"/; s/^  sha256 .*/  sha256 \"$SHA256\"/" Casks/twindesk.rb
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Cask: TwinDesk $VERSION"
          git push origin main
